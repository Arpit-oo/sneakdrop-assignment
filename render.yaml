# Render blueprint: the app (built from ./Dockerfile) + a managed Postgres.
# Deploy: https://render.com/deploy?repo=https://github.com/Arpit-oo/sneakdrop-assignment
services:
  - type: web
    name: sneakdrop
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sneakdrop-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: STOCK
        value: "20"
      - key: HOLD_SECONDS
        value: "300"
      - key: MAX_PER_USER
        value: "2"
      - key: LOG_LEVEL
        value: info

databases:
  - name: sneakdrop-db
    plan: free
    databaseName: sneakdrop
    user: sneak
    postgresMajorVersion: "16"
